name: Generate Profile Metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: zhuobichen
          outputs: |
            generated/github-snake.svg
            generated/github-snake-dark.svg?palette=github-dark

      - name: Prepare output
        run: |
          rm -rf dist
          mkdir -p dist
          cp generated/github-snake.svg dist/github-snake.svg
          cp generated/github-snake-dark.svg dist/github-snake-dark.svg

      - name: Publish output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
