<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520">
  <rect width="1280" height="520" rx="12" fill="#0d1117"/>
  <style>
    text { font-family: Ubuntu, Helvetica, Arial, sans-serif; }
    .label { fill: #c9d1d9; font-size: 22px; }
    .value { fill: #f0c674; font-size: 22px; font-weight: 700; }
    .note { fill: #8b949e; font-size: 16px; }
    .track { fill: #21262d; }
    .bar { fill: #f0c674; }
  </style>
  <text x="56" y="58" fill="#f0c674" font-size="30" font-weight="700">Contribution metrics</text>
  <text x="56" y="88" class="note">Each category is shown separately; values are not forced onto one shared scale.</text>
  <g transform="translate(56 126)">
    <text class="label" x="0" y="22">Commits</text>
    <rect class="track" x="190" y="4" width="900" height="28" rx="6"/>
    <rect class="bar" x="190" y="4" width="900" height="28" rx="6"/>
    <text class="value" x="1110" y="26">810</text>
  </g>
  <g transform="translate(56 196)">
    <text class="label" x="0" y="22">Repositories</text>
    <rect class="track" x="190" y="4" width="900" height="28" rx="6"/>
    <rect class="bar" x="190" y="4" width="145" height="28" rx="6"/>
    <text class="value" x="1110" y="26">23</text>
  </g>
  <g transform="translate(56 266)">
    <text class="label" x="0" y="22">Pull requests</text>
    <rect class="track" x="190" y="4" width="900" height="28" rx="6"/>
    <rect class="bar" x="190" y="4" width="34" height="28" rx="6"/>
    <text class="value" x="1110" y="26">1</text>
  </g>
  <g transform="translate(56 336)">
    <text class="label" x="0" y="22">Issues</text>
    <rect class="track" x="190" y="4" width="900" height="28" rx="6"/>
    <text class="value" x="1110" y="26">0</text>
  </g>
  <g transform="translate(56 406)">
    <text class="label" x="0" y="22">Reviews</text>
    <rect class="track" x="190" y="4" width="900" height="28" rx="6"/>
    <text class="value" x="1110" y="26">0</text>
  </g>
</svg>
